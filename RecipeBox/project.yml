name: RecipeBox
options:
  bundleIdPrefix: com.recipebox
  deploymentTarget:
    iOS: "17.0"
targets:
  RecipeBox:
    type: application
    platform: iOS
    sources: [RecipeBox]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recipebox.app
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Recipe Box
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Add photos to your recipes and import recipes from screenshots.
        INFOPLIST_KEY_NSCameraUsageDescription: Take photos of your dishes for your recipes.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Transcribe the spoken instructions in cooking videos you choose, so the recipe can be extracted.
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
  RecipeBoxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RecipeBoxTests]
    dependencies:
      - target: RecipeBox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
schemes:
  RecipeBox:
    build:
      targets:
        RecipeBox: all
        RecipeBoxTests: [test]
    test:
      targets: [RecipeBoxTests]
